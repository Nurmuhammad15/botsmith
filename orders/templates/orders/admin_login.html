<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="google-site-verification" content="6WJqJoJb_6cAeENWc4qfiB-U1z83jF9briKX2no9D58">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotSmith — Вход для администратора</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{background:#0e0e0e;font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .card{background:#161618;border:1px solid #2a2a2e;border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 32px 80px rgba(0,0,0,.5)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
  .logo-box{width:36px;height:36px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0e0e0e;letter-spacing:-1px}
  .logo-text{font-size:18px;font-weight:700;color:#fff}
  .admin-badge{padding:2px 8px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:5px;font-size:11px;font-weight:700;color:#f87171;letter-spacing:.5px;margin-left:4px}
  h1{font-size:24px;font-weight:800;color:#fff;margin-bottom:6px}
  .sub{font-size:13px;color:#71717a;margin-bottom:28px}
  label{display:block;font-size:12px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
  input{width:100%;padding:13px 14px;border:1.5px solid #2a2a2e;border-radius:10px;font-family:var(--font);font-size:15px;background:#0e0e0e;color:#fff;outline:none;transition:border-color .18s;margin-bottom:14px}
  input:focus{border-color:#555}
  input::placeholder{color:#52525b}
  .btn{width:100%;padding:14px;background:#fff;color:#0e0e0e;border:none;border-radius:10px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{opacity:.88}
  .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:7px}
  .back{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:20px;font-size:13px;color:#52525b;text-decoration:none;transition:color .18s}
  .back:hover{color:#fff}

  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:44px !important}
  .pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#52525b;font-size:20px;padding:0;display:flex;align-items:center;transition:color .18s;line-height:1}
  .pwd-eye:hover{color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-box">BS</div>
    <span class="logo-text">BotSmith</span>
    <span class="admin-badge">ADMIN</span>
  </div>
  <h1>Вход для администратора</h1>
  <p class="sub">Доступ только для сотрудников BotSmith</p>

  {% if error %}
  <div class="error"><i class="uil uil-exclamation-triangle"></i> {{ error }}</div>
  {% endif %}

  <form method="post" action="/admin-login/">
    {% csrf_token %}
    <label>Логин</label>
    <input type="text" name="username" placeholder="admin_username" autocomplete="username" required>
    <label>Пароль</label>
    <div class="pwd-wrap" style="position:relative">
      <input type="password" name="password" id="adminPwd" placeholder="••••••••" autocomplete="current-password" required style="width:100%">
      <button type="button" class="pwd-eye" onclick="toggleEye('adminPwd',this)"><i class="uil uil-eye"></i></button>
    </div>
    <button type="submit" class="btn">
      <i class="uil uil-lock-alt"></i> Войти в панель
    </button>
  </form>

  <a href="/" class="back">
    <i class="uil uil-arrow-left"></i> На главную
  </a>
</div>

<script>
function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'uil uil-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'uil uil-eye';
  }
}
</script>

</body>
</html>
