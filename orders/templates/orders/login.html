<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="google-site-verification" content="2Oxd-Ab5igr9f7EG_9OqaLOrflztT5IXHTIkcdchApg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotSmith — Вход</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0e0e0e;
    --white: #ffffff;
    --gray: #f4f4f5;
    --gray-border: #e4e4e7;
    --gray-text: #71717a;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  }
  body {
    background: var(--black);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .back-home {
    position: absolute; top: 24px; left: 24px;
    display: flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--gray-text);
    font-size: 13px; font-weight: 600; transition: all .2s;
  }
  .back-home:hover { color: var(--white); }
  .card {
    background: var(--white);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 32px 80px rgba(0,0,0,.4);
  }
  .logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 32px;
  }
  .logo-box {
    width: 36px; height: 36px; background: var(--black); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: white; letter-spacing: -1px;
  }
  .logo-text { font-size: 18px; font-weight: 700; color: var(--black); }
  h1 { font-size: 26px; font-weight: 800; color: var(--black); margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--gray-text); margin-bottom: 32px; }

  /* TABS */
  .tabs {
    display: flex; gap: 4px; background: var(--gray);
    border-radius: 10px; padding: 4px; margin-bottom: 24px;
  }
  .tab {
    flex: 1; padding: 9px; border: none; background: transparent;
    border-radius: 7px; cursor: pointer; font-family: var(--font);
    font-size: 13px; font-weight: 600; color: var(--gray-text);
    transition: background .18s, color .18s;
  }
  .tab.active {
    background: white; color: var(--black);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--black); margin-bottom: 6px;
  }
  input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--gray-border); border-radius: 10px;
    font-family: var(--font); font-size: 15px;
    background: var(--white); color: var(--black);
    outline: none; transition: border-color .18s; margin-bottom: 14px;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--black); }
  .btn {
    width: 100%; padding: 14px; background: var(--black); color: white;
    border: none; border-radius: 10px; font-family: var(--font);
    font-size: 15px; font-weight: 700; cursor: pointer;
    letter-spacing: .3px; transition: opacity .2s, transform .15s;
    margin-top: 4px;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    border-radius: 9px; padding: 10px 14px; font-size: 13px;
    font-weight: 500; margin-bottom: 16px;
  }
  .success {
    background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a;
    border-radius: 9px; padding: 10px 14px; font-size: 13px;
    font-weight: 500; margin-bottom: 16px;
  }

  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:44px !important}
  .pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#a1a1aa;font-size:20px;padding:0;display:flex;align-items:center;transition:color .18s;line-height:1}
  .pwd-eye:hover{color:#0e0e0e}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.css">
</head>
<body>
<a href="/" class="back-home">← На главную</a>

<div class="card">
  <div class="logo">
    <div class="logo-box">BS</div>
    <span class="logo-text">BotSmith</span>
  </div>
  <h1 id="formTitle">Вход в систему</h1>
  <p class="sub" id="formSub">Введите логин и пароль для доступа</p>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Войти</button>
    <button class="tab" id="tabReg" onclick="switchTab('register')">Регистрация</button>
  </div>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="success">✓ {{ success }}</div>
  {% endif %}

  <!-- LOGIN FORM -->
  <div id="loginSection">
    <form method="post" action="/login/">
      {% csrf_token %}
      <input type="hidden" name="form_type" value="login">
      <label for="username">Логин</label>
      <input type="text" name="username" id="username" placeholder="your_username" autocomplete="username" required>
      <label for="password">Пароль</label>
      <div class="pwd-wrap" style="position:relative">
        <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required style="width:100%">
        <button type="button" class="pwd-eye" onclick="toggleEye('password',this)"><i class="uil uil-eye"></i></button>
      </div>
      <button type="submit" class="btn">Войти →</button>
    </form>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerSection" style="display:none">
    <form method="post" action="/register/">
      {% csrf_token %}
      <label for="reg_username">Логин</label>
      <input type="text" name="username" id="reg_username" placeholder="your_username" autocomplete="username" required>
      <label for="reg_email">Email</label>
      <input type="email" name="email" id="reg_email" placeholder="you@example.com" autocomplete="email">
      <label for="reg_password">Пароль</label>
      <div class="pwd-wrap" style="position:relative">
        <input type="password" name="password" id="reg_password" placeholder="Минимум 6 символов" required style="width:100%">
        <button type="button" class="pwd-eye" onclick="toggleEye('reg_password',this)"><i class="uil uil-eye"></i></button>
      </div>
      <button type="submit" class="btn">Создать аккаунт →</button>
    </form>
  </div>
</div>

<script>
  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabReg').classList.toggle('active', !isLogin);
    document.getElementById('loginSection').style.display = isLogin ? '' : 'none';
    document.getElementById('registerSection').style.display = isLogin ? 'none' : '';
    document.getElementById('formTitle').textContent = isLogin ? 'Вход в систему' : 'Регистрация';
    document.getElementById('formSub').textContent = isLogin ? 'Введите логин и пароль для доступа' : 'Создайте аккаунт для заказа ботов';
  }
  // Auto-open register tab if server says so, or via URL
  {% if open_register %}switchTab('register');{% endif %}
  if (window.location.search.includes('tab=register')) switchTab('register');
</script>

<script>
function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'uil uil-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'uil uil-eye';
  }
}
</script>

</body>
</html>
